async function openHistory(){localVersions=await vault.versions(documentId);sharedVersions=[];if(sync.config&&sync.status==='online'){try{sharedVersions=(await sync.versions()).versions;}catch(e){toast(e.message,true);}}showDialog('A little room to look back',`<p class="modal-description">Keep named checkpoints as your design evolves. Restoring a version creates new, undoable edits instead of rewinding the collaboration clock.</p><button class="button primary" data-cmd="checkpoint">${icon('plus',15)}Save a checkpoint</button><div class="modal-section"><h3>${sync.config?'Shared checkpoints':'Saved checkpoints'}</h3>${(sync.config?sharedVersions:localVersions).map(v=>`<div class="history-row">${icon('clock')}<div><strong>${esc(v.name)}</strong><small>${new Date(v.createdAt).toLocaleString()}</small></div><button data-restore-version="${v.id}" data-shared="${!!sync.config}">Restore</button></div>`).join('')||'<p class="info-note">No checkpoints yet. Save one before making a big change.</p>'}</div><div class="modal-section"><h3>Recent local edits</h3>${store.undoStack.slice(-12).reverse().map(e=>`<div class="history-row">${icon('undo')}<div><strong>${esc(e.label)}</strong><small>${e.changes.length} affected elements</small></div></div>`).join('')||'<p class="info-note">Your editing history starts with your first change.</p>'}</div>`);}
async function checkpoint(){const name=await ask('Keep this moment','Checkpoint name','Design review '+new Date().toLocaleDateString());if(!name)return;await saveNow();if(sync.config){if(sync.queue.length)throw Error('Wait for pending edits to sync before saving a shared checkpoint');await sync.checkpoint(name);}else await vault.checkpoint(documentId,store.snapshot(),name);await openHistory();toast('Checkpoint saved');}
async function restoreVersion(id,shared){if(!canEdit())throw Error('Editing permission is required');if(!confirm('Restore this checkpoint? This creates new edits and can be undone.'))return;const version=shared?(await sync.version(id)):localVersions.find(v=>v.id===id);if(!version)throw Error('Checkpoint not found');restoreAsEdits(store,version.snapshot);editor.select([]);closeDialog();fitAll();toast('Checkpoint restored as a new edit');}
function openExport(){showDialog('Ready for its next chapter',`<p class="modal-description">Take your work anywhere. Images and fonts used by the system remain local; uploaded images are embedded.</p><div class="invite-row" style="margin-bottom:19px"><select id="export-scope" style="flex:1;max-width:none" aria-label="Export scope"><option value="selection" ${exportScope==='selection'?'selected':''}>Selection${editor.selection.size?' · '+editor.selection.size+' elements':' · all screens when empty'}</option><option value="all" ${exportScope==='all'?'selected':''}>All screens</option><option value="screen" ${exportScope==='screen'?'selected':''}>Current screen</option></select><select id="export-scale" aria-label="PNG export scale"><option value="1" ${exportScale===1?'selected':''}>PNG 1×</option><option value="2" ${exportScale===2?'selected':''}>PNG 2×</option><option value="3" ${exportScale===3?'selected':''}>PNG 3×</option></select></div><div class="export-grid">${[['export-png','image','PNG image','High-resolution raster image.'],['export-svg','pen','SVG vector','Scalable shapes, paths, and text.'],['export-html','code','HTML prototype','Interactive screens with navigation.'],['export-json','folder','Mireva document','Complete editable project and assets.'],['export-package','folder','Portable ZIP package','Validated editable document and embedded assets.']].map(([cmd,ic,title,desc])=>`<button class="export-card" data-cmd="${cmd}">${icon(ic)}<strong>${title}</strong><span>${desc}</span></button>`).join('')}</div><p class="info-note" style="margin-top:19px">SVG and PNG use your chosen scope. Native documents and HTML prototypes include the full project. The HTML prototype does not contain collaboration credentials.</p>`);}
function exportIds(){return exportScope==='all'?[]:exportScope==='screen'?[activeFrame()?.id].filter(Boolean):[...editor.selection];}
function filename(){return(store.get('project')?.name||'Mireva design').replace(/[^\p{L}\p{N}_ -]/gu,'').trim()||'Mireva design';}
async function doExport(kind){if(kind==='json'){download(filename()+'.mireva',JSON.stringify(store.snapshot(),null,2),'application/json');toast('Editable project exported');}if(kind==='svg'){download(filename()+'.svg',svgExport(store,exportIds()),'image/svg+xml');toast('SVG exported');}if(kind==='png'){toast('Rendering PNG…');const blob=await pngExport(store,exportIds(),exportScale);download(filename()+'.png',blob);toast('PNG exported');}if(kind==='html'){download(filename()+'.html',htmlExport(store),'text/html');toast('Standalone HTML prototype exported');}}
function preview(){finishText();if(!frames().length)throw Error('Add a screen to preview your design');const start=(editor.selection.size?activeFrame()?.id:null)||store.get('project')?.startFrame||frames()[0].id;$('#prototype-frame').srcdoc=htmlExport(store,{startFrame:start});$('#preview-title').textContent=store.get('project')?.name||'Prototype';$('#preview-dialog').showModal();}
function settings(){showDialog('Make yourself at home',`<div class="modal-form"><label>Your display name<input id="settings-name" value="${esc(identity.name)}" maxlength="40"></label><label>Cursor color<input id="settings-color" type="color" value="${identity.color}" style="height:35px;width:70px"></label><label>Editor appearance<select id="settings-theme"><option value="light" ${preferences.theme==='light'?'selected':''}>Light · a little clarity</option><option value="dark" ${preferences.theme==='dark'?'selected':''}>Dark · after hours</option></select></label><label>Collaboration server<input id="settings-server" value="${esc(preferences.server)}" placeholder="http://localhost:4173"></label></div><label class="toggle-row">Smart alignment guides<input id="settings-snap" type="checkbox" ${editor.snap?'checked':''}></label><label class="toggle-row">Snap to 8 px grid<input id="settings-grid" type="checkbox" ${editor.grid?'checked':''}></label><div class="modal-section"><h3>Rendering engine</h3><p class="info-note">${esc(renderer.mode)} · ${renderer.stats.total||0} layers<br>${renderer.mode==='WebGPU'?'Native GPU shapes with retained text/path/image atlases.':esc(renderer.fallbackReason||'Canvas compatibility mode')+'. The same document and editing tools remain available.'}</p></div><div class="modal-section"><h3>AI provider configuration</h3><p class="info-note">Set <code>AI_URL</code>, <code>AI_MODEL</code>, and <code>AI_KEY</code> in the server environment. Keys stay on the server. No provider is configured or billed by this download.</p></div><div class="modal-actions"><button class="button primary" data-cmd="save-settings">Save preferences</button></div>`);}
async function saveSettings(){identity={name:$('#settings-name').value.trim().slice(0,40)||'Designer',color:$('#settings-color').value};preferences={theme:$('#settings-theme').value,server:$('#settings-server').value.trim(),snap:$('#settings-snap').checked,grid:$('#settings-grid').checked};await vault.setting('identity',identity);await vault.setting('preferences',preferences);document.body.classList.toggle('dark',preferences.theme==='dark');editor.snap=preferences.snap;editor.grid=preferences.grid;updatePresence(sync.peers);editor.presence();closeDialog();toast('Preferences saved');}

function contextMenu(x,y){const menu=$('#context-menu');menu.innerHTML=[['copy','Copy','Ctrl C'],['paste','Paste','Ctrl V'],['duplicate','Duplicate','Ctrl D'],['group','Group selection','Ctrl G'],['ungroup','Ungroup','⇧ Ctrl G'],['rename','Rename',''],['bring-front','Bring to front',']'],['send-back','Send to back','['],['lock-selection','Lock / unlock',''],['hide-selection','Hide / show',''],['make-component','Create component',''],['delete','Delete','Del']].map(([cmd,label,key])=>`<button data-cmd="${cmd}" role="menuitem"><span>${label}</span><kbd>${key}</kbd></button>`).join('');menu.hidden=false;menu.style.left=Math.min(x,innerWidth-230)+'px';menu.style.top=Math.max(8,Math.min(y,innerHeight-420))+'px';}
function captureClipboard(){const roots=topSelection(store,[...editor.selection]);if(!roots.length)throw Error('Select something to copy');const nodes=roots.flatMap(id=>[store.get(id),...store.descendants(id)]).map(n=>{const{id,_stamps,...values}=clone(n);return{id,...values};});return{format:'mireva-clipboard',roots,nodes};}
async function copySelection(){clipboard=captureClipboard();try{await navigator.clipboard.writeText(JSON.stringify(clipboard));}catch{}toast('Selection copied');}
async function pasteSelection(){if(!canEdit())throw Error('Editing permission is required');let data=clipboard;try{const text=await navigator.clipboard.readText();if(text.startsWith('{')){const parsed=JSON.parse(text);if(parsed.format==='mireva-clipboard')data=parsed;}}catch{}if(!data?.nodes?.length)throw Error('Copy elements from a Mireva project first');if(data.nodes.length>5000)throw Error('Paste at most 5,000 layers at a time');const ids=new Map(data.nodes.map(n=>[n.id,uid()]));store.transact('Paste elements',()=>{for(const n of data.nodes){const{id,...v}=clone(n);v.parent=ids.get(v.parent)||(store.get(v.parent)?v.parent:'');v.target=ids.get(v.target)||v.target||'';if(data.roots.includes(id)){v.x+=24;v.y+=24;v.order=nextOrder(v.parent);}store.add(v,ids.get(id));}});editor.select(data.roots.map(id=>ids.get(id)));}
function arrange(front){store.transact(front?'Bring to front':'Send to back',()=>{for(const id of topSelection(store,[...editor.selection])){const n=store.get(id),siblings=store.children(n.parent);store.set(id,{order:(front?Math.max(...siblings.map(s=>s.order)):Math.min(...siblings.map(s=>s.order)))+(front?1:-1)});}});}
async function rename(){const n=firstSelected();if(!n)return;const name=await ask('Give it a name','Layer name',n.name);if(name)store.set(n.id,{name});}
function addHotspot(){const pos=insertion();let id;store.transact('Add hotspot',()=>id=store.add(node('hotspot',{...pos,w:140,h:60,name:'Interaction hotspot',fill:'transparent',order:nextOrder(pos.parent),action:'navigate',target:frames().find(f=>f.id!==pos.parent)?.id||'',trigger:'click',transition:'fade'})));editor.select([id]);setMode('prototype');}
async function exec(cmd){
 if(cmd==='export-package'){download((store.get('project')?.name||'design')+'.mireva.zip',portableArchive(store),'application/zip');return;}if(cmd==='workspace'){finishText();await workspace.show();return;}if(cmd==='vector-pen'){finishText();vector.startPen();return;}if(cmd==='vector-edit'){finishText();vector.start([...editor.selection][0]);return;}if(cmd.startsWith('boolean-')){await vector.combine(cmd.slice(8));return;}
finishText();$('#context-menu').hidden=true;switch(cmd){
 case'projects':return openProjects();case'new-project':return newProject();case'rename-project':{const name=await ask('The beginning of something','Project name',store.get('project')?.name);if(name)store.set('project',{name});break;}
 case'undo':store.undo();editor.select([...editor.selection]);break;case'redo':store.redo();editor.select([...editor.selection]);break;
 case'share':return openShare();case'export':return openExport();case'preview':return preview();case'new-screen':return screenDialog();case'help':return help();
 case'zoom-out':renderer.zoom(renderer.camera.z/1.2);break;case'zoom-in':renderer.zoom(renderer.camera.z*1.2);break;case'zoom-menu':showDialog('A different perspective',`<div class="export-grid">${[25,50,75,100,150,200].map(n=>`<button class="button" data-zoom="${n}">${n}%</button>`).join('')}</div><div class="modal-actions"><button class="button" data-cmd="fit">Fit all screens</button><button class="button" data-cmd="fit-selection">Fit selection</button></div>`);break;
 case'fit':closeDialog();fitAll();break;case'fit-selection':closeDialog();if(editor.selection.size)editor.fitSelection();else fitAll();break;
 case'wireframe':renderer.wireframe=!renderer.wireframe;$('#wireframe-button').classList.toggle('active',renderer.wireframe);renderer.invalidate();break;
 case'comments':setPanel('comments');break;case'toggle-inspector':document.body.classList.toggle('show-inspector');break;case'close-library':document.body.classList.remove('show-library');break;
 case'command-palette':return commandPalette();case'history':return openHistory();case'settings':return settings();case'close-dialog':closeDialog();break;case'close-preview':$('#preview-dialog').close();$('#prototype-frame').srcdoc='';break;
 case'import':chooseFile('normal');break;case'import-image':chooseFile('image');break;case'extract-palette':chooseFile('palette');break;case'scan-screenshot':scanImage=null;showScan();break;case'choose-scan':chooseFile('scan');break;
 case'generate':return generate();case'reconstruct':return reconstruct();case'create-room':return createRoom();case'create-invite':return createInvite();case'copy-invite':return copyText(lastInvite,'Invitation link copied');case'owner-link':return copyText(sync.shareLink(),'Private owner recovery link copied');case'disconnect':return disconnect();
 case'checkpoint':return checkpoint();case'export-png':return doExport('png');case'export-svg':return doExport('svg');case'export-html':return doExport('html');case'export-json':return doExport('json');case'save-settings':return saveSettings();
 case'selection-menu':{const r=$('[data-cmd="selection-menu"]').getBoundingClientRect();contextMenu(r.right-220,r.bottom);break;}
 case'copy-css':if(firstSelected())return copyText(nodeCSS(firstSelected()),'CSS copied');break;
 case'set-start':if(firstSelected()?.type==='frame')store.set('project',{startFrame:firstSelected().id});break;
 case'add-hotspot':return addHotspot();case'transparent-fill':editSelection({fill:'transparent'});break;
 case'group':editor.select([group(store,[...editor.selection])]);break;case'ungroup':editor.select([...editor.selection].flatMap(id=>ungroup(store,id)));break;
 case'make-component':if(firstSelected())makeComponent(store,firstSelected().id);else throw Error('Select an element or group first');break;
 case'update-instances':if(firstSelected())syncInstances(store,firstSelected().id);break;
 case'detach-instance':store.transact('Detach instance',()=>{for(const id of editor.selection)for(const n of [store.get(id),...store.descendants(id)])store.set(n.id,{componentId:''});});break;
 case'duplicate':editor.select(duplicate(store,[...editor.selection]));break;case'delete':store.transact('Delete selection',()=>{for(const id of editor.editableRoots())store.delete(id);});editor.select([]);break;
 case'copy':return copySelection();case'cut':await copySelection();return exec('delete');case'paste':return pasteSelection();case'select-all':editor.select(store.children('').filter(n=>!n.hidden&&!n.locked).map(n=>n.id));break;
 case'bring-front':arrange(true);break;case'send-back':arrange(false);break;case'distribute-x':distribute(store,[...editor.selection],'x');break;case'distribute-y':distribute(store,[...editor.selection],'y');break;
 case'rename':return rename();case'lock-selection':editSelection({locked:!selected().every(n=>n.locked)});break;case'hide-selection':editSelection({hidden:!selected().every(n=>n.hidden)});break;
 default:throw Error('Unknown command: '+cmd);
 }updateHeader();renderInspector();if(panel==='layers')renderLayers();}

 if(d.layer){const s=new Set(editor.selection);if(e.shiftKey){s.has(d.layer)?s.delete(d.layer):s.add(d.layer);editor.select([...s]);}else editor.select([d.layer]);return;}

 if(d.comment||d.focusComment){const c=store.get(d.comment||d.focusComment);if(c?.frame){editor.select([c.frame]);editor.fitSelection();}setPanel('comments');setTimeout(()=>document.querySelector(`[data-focus-comment="${c?.id}"]`)?.scrollIntoView({block:'nearest'}),30);return;}
 if(d.commentsFilter){showResolved=d.commentsFilter==='all';return renderPanel();}if(d.resolveComment){const c=store.get(d.resolveComment);store.set(c.id,{resolved:!c.resolved});return renderPanel();}if(d.reply)return reply(d.reply);

}));
