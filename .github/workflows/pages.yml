name: Publish editor to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source
        run: npm run check
      - name: Test core and server
        run: npm test
      - name: Build standalone editor
        run: npm run build
      - name: Install browser test tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_PATH=' + p.chromium.executable_path)
          PY
      - name: Smoke test GitHub Pages subpath
        run: python tests/pages_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: pages-browser-verification
          path: |
            test-artifacts/pages-results.json
            test-artifacts/pages-editor.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the public release
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          expected = os.environ['GITHUB_SHA']
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(base + 'build-info.json?v=' + expected, timeout=20) as response:
                      assert response.status == 200
                      info = json.load(response)
                  assert info['version'] == '0.2.0' and info['commit'] == expected, info
                  assert info['hosting'] == 'static' and info['serverServices'] is False
                  with urllib.request.urlopen(base + '?v=' + expected, timeout=20) as response:
                      assert response.status == 200
                      html = response.read().decode('utf-8')
                  assert 'Mireva Studio' in html and 'name="mireva-hosting" content="static"' in html
                  print(json.dumps({'url': base, 'http': 200, **info}, indent=2))
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(5)
          PY
