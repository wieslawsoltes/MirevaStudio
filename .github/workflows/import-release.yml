name: Import verified Mireva Studio 0.2.0
on:
  push:
    branches: [main]
    paths: ['.bootstrap/payload.sha256']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mireva-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and expand the complete source package
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, lzma, shutil
          parts = sorted(Path('.bootstrap').glob('part-*.xz'))
          assert len(parts) == 26, 'Incomplete source transfer'
          data = b''.join(p.read_bytes() for p in parts)
          expected = Path('.bootstrap/payload.sha256').read_text().strip()
          assert len(data) == 193016
          assert hashlib.sha256(data).hexdigest() == expected == 'c7593958b8e066af6076be2d44a918ee6e17cac9b164b30e0806182c865fb42a'
          raw = lzma.decompress(data, memlimit=256 * 1024 * 1024)
          assert len(raw) < 20 * 1024 * 1024
          files = json.loads(raw)
          assert len(files) == 85
          for name, content in files.items():
              relative = PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[0] not in ('.git', '.github', '.bootstrap')
              assert isinstance(content, str)
              target = Path(name)
              assert not target.is_symlink()
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')
          shutil.rmtree('.bootstrap')
          print('Verified and expanded all 85 source files.')
          PY
          sha256sum -c MANIFEST.sha256
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax, test core and server, build editor
        run: |
          npm run check
          npm test
          npm run build
      - name: Install browser acceptance tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_PATH=' + p.chromium.executable_path)
          PY
      - name: Verify the actual Pages project subpath
        run: |
          python tests/pages_test.py
          cp test-artifacts/pages-editor.png docs/images/editor-preview.png
          cp test-artifacts/pages-results.json docs/test-evidence/pages-publish.json
      - name: Commit the verified readable source to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Import Mireva Studio 0.2.0 complete source and Pages support'
          git push origin HEAD:main
      - name: Build and stage the static site
        run: |
          MIREVA_COMMIT="$(git rev-parse HEAD)" npm run build
          export GIT_INDEX_FILE="$RUNNER_TEMP/mireva-pages.index"
          rm -f "$GIT_INDEX_FILE"
          git -C dist --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE/dist" add --all
          tree="$(git write-tree)"
          parents=()
          if git ls-remote --exit-code --heads origin pages-build >/dev/null; then
            git fetch origin pages-build
            parents=(-p "$(git rev-parse FETCH_HEAD)")
          fi
          commit="$(printf 'Build Mireva Studio 0.2.0 static editor\n' | git commit-tree "$tree" "${parents[@]}")"
          git push origin "$commit:refs/heads/pages-build"
          echo "Static site commit: $commit"
          unset GIT_INDEX_FILE
          mkdir -p release
          git archive --format=zip --prefix=mireva-studio/ -o release/mireva-studio-0.2.0-source.zip HEAD
          cp mireva-studio.html release/mireva-studio-0.2.0.html
      - uses: actions/upload-artifact@v4
        with:
          name: mireva-studio-0.2.0-verified-release
          path: |
            release/
            test-artifacts/pages-results.json
            test-artifacts/pages-editor.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
